name: Danger

on:
  pull_request:
    types: [opened, reopened, edited, synchronize]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  danger:
    uses: numbata/danger-pr-comment/.github/workflows/danger-run.yml@v0.1.0
    with:
      ruby-version: '3.4'
      bundler-cache: true
